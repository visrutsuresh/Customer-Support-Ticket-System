name: keep-awake

# Render's free tier sleeps a service after 15 idle minutes and the wake takes
# ~a minute, which reads as a broken site. A ping every 10 minutes keeps it warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s -m 30 -o /dev/null -w "backend %{http_code}\n" https://customer-support-ticket-systemhol.onrender.com/ || true
