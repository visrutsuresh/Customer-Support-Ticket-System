# Local stack for the #1 Customer Support app: Postgres + Weaviate + the API.
# Start everything:  docker compose up -d --build
# DBs only (run the API with uvicorn yourself):  docker compose up -d postgres weaviate
name: customer-support-ticket-system
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # inside the compose network the DBs answer to their service names, not localhost
      DATABASE_URL: postgresql://support:support@postgres:5432/tickets
      WEAVIATE_HOST: weaviate
    depends_on:
      - postgres
      - weaviate
    restart: unless-stopped

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.38.2
    ports:
      - "8080:8080"      # REST API (what we talk to from Python)
      - "50051:50051"    # gRPC API (faster channel the client also uses)
    restart: unless-stopped
    environment:
      CLUSTER_HOSTNAME: 'node1'
      CLUSTER_ADVERTISE_ADDR: '127.0.0.1'
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_API_BASED_MODULES: 'true'
    volumes:
      - weaviate_data:/var/lib/weaviate

  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: tickets
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  weaviate_data:
  pgdata: